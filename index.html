<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob: https://discord.com https://ptb.discord.com https://canary.discord.com https://discordapp.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM Save Card</title>
<link rel="stylesheet" href="savecard.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="slash" aria-hidden="true"><i></i><i></i></span><h1>DM <span>Save Card</span></h1><span class="ver" id="ver"></span></div>
  <nav class="tabs" id="tabs" aria-label="Post types"></nav>
  <div class="hside"><div class="folder" id="folder"></div><button class="hbtn" id="helpbtn" type="button" aria-haspopup="dialog">? Help</button><button class="hbtn" id="pick" type="button" hidden>Choose save folder</button></div>
  <input type="file" id="dir" webkitdirectory directory multiple hidden>
</header>
<div class="chq" aria-hidden="true"></div>
<nav class="subtabs" id="subtabs" aria-label="Post types" hidden></nav>
<main class="layout">
  <aside class="plate list" aria-label="Saves">
    <h2 class="sec"><span aria-hidden="true">//</span> Saves</h2>
    <div id="slots"><p class="empty">Looking for your saves…</p></div>
  </aside>
  <section class="plate main" id="main" aria-live="polite">
    <p class="empty">Pick a save on the left.</p>
  </section>
</main>
<dialog class="hlp" id="help" aria-label="How it works"></dialog>
<script src="js/save.js"></script>
<script src="js/text.js"></script>
<script src="js/report.js"></script>
<script src="js/recap.js"></script>
<script src="js/diary.js"></script>
<script src="js/post.js"></script>
<script src="js/card.js"></script>
<script src="js/views.js"></script>
<script src="js/cards.js"></script>
<script src="js/chronicle.js"></script>
<script src="js/angles.js"></script>
<script src="js/episode.js"></script>
<script src="js/epcards.js"></script>
<script src="js/book.js"></script>
<script src="js/extra.js"></script>
<script src="js/extracards.js"></script>
<script src="js/assist.js"></script>
<script src="js/help.js"></script>
<script src="js/webhook.js"></script>
<script src="js/app.js"></script>
</body>
</html>
